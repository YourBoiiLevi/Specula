<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Specula Config</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <div class="brand">Specula · <span>Config</span></div>
    <div class="status-dot" id="save-status"></div>
  </header>
  <main>
    <section id="global-settings">
      <h2>Global Settings</h2>
      <div id="global-settings-container"></div>
    </section>
    <section id="pipelines">
      <h2>Pipelines <span id="pipeline-count-badge"></span></h2>
      <div id="pipelines-container"></div>
      <button id="add-pipeline" type="button">+ Add pipeline</button>
    </section>
    <section id="status">
      <h2>Pipeline Status</h2>
      <div id="status-table-container"></div>
    </section>
    <div id="save-bar">
      <div id="validation-banner"></div>
      <button id="save-button" type="button">Save configuration</button>
    </div>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
